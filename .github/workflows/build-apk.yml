name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Info ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME}"

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Raw Java version string: ${RAW_VERSION}"

          if [ -z "${RAW_VERSION}" ]; then
            echo "Error: Unable to detect Java version from 'java -version'."
            exit 1
          fi

          MAJOR_VERSION=$(echo "${RAW_VERSION}" | awk -F. '{if ($1 == "1") print $2; else print $1;}')
          echo "Parsed Java major version: ${MAJOR_VERSION}"

          if [ -z "${MAJOR_VERSION}" ] || ! [ "${MAJOR_VERSION}" -eq "${MAJOR_VERSION}" ] 2>/dev/null; then
            echo "Error: Failed to parse valid integer Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "Error: Active Java major version (${MAJOR_VERSION}) is lower than 17. Required: 17 or newer."
            exit 1
          fi

          echo "Java environment verified successfully: Java ${MAJOR_VERSION} >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be found or created."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${TARGET_APK}" ]; then
            echo "Error: Expected debug APK not found at ${TARGET_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching only inside app/build/outputs/apk for diagnostic purposes:"
              find app/build/outputs/apk -maxdepth 3 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${TARGET_APK}" ]; then
            echo "Error: APK file ${TARGET_APK} exists but is empty (0 bytes)."
            exit 1
          fi

          case "${TARGET_APK}" in
            *.apk) ;;
            *)
              echo "Error: File does not have .apk extension: ${TARGET_APK}"
              exit 1
              ;;
          esac

          if [ "${TARGET_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path must be exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verification successful:"
          ls -lh "${TARGET_APK}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          CLEAN_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "${CLEAN_REPO_NAME}" ]; then
            CLEAN_REPO_NAME="android-app"
          fi

          ASSET_NAME="${CLEAN_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="${RUNNER_TEMP:-/tmp}/release_assets"
          mkdir -p "${TEMP_RELEASE_DIR}"

          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"

          echo "Prepared release asset at: ${ASSET_PATH}"
          ls -lh "${ASSET_PATH}"

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ]; then
            echo "Error: Prepared release asset does not exist at '${ASSET_PATH}'."
            exit 1
          fi

          if [ ! -s "${ASSET_PATH}" ]; then
            echo "Error: Prepared release asset is empty (0 bytes)."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "Error: Release asset does not have .apk extension: ${ASSET_PATH}"
              exit 1
              ;;
          esac

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(cat <<EOF
          ## Automated Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Workflow Run Number**: ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Intended Use**: Testing and verification
          - **Notice**: This is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release with tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "${NOTES}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            RELEASE_URL=$(gh release view "${TAG_NAME}" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}")
            RELEASE_TITLE=$(gh release view "${TAG_NAME}" --json name -q .name 2>/dev/null || echo "Debug APK Build #${GITHUB_RUN_NUMBER}")

            echo "Release Tag: ${TAG_NAME}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "### 🚀 Debug APK Published Successfully"
              echo ""
              echo "- **Release Page**: [${RELEASE_TITLE}](${RELEASE_URL})"
              echo "- **Release Tag**: \`${TAG_NAME}\`"
              echo "- **APK Filename**: \`${ASSET_NAME}\`"
              echo ""
              echo "📱 **Download Instructions**:"
              echo "You can download the APK directly to your phone from the **Assets** section of the [GitHub Release page](${RELEASE_URL})."
              echo ""
              echo "📦 **Backup Artifact**:"
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the APK build succeeded."
            echo "The GitHub Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions workflow artifact."
              echo ""
              echo "However, publishing directly to GitHub Releases could not be completed."
              echo ""
              echo "📦 **How to Download the APK**:"
              echo "Download the \`app-debug-apk\` artifact directly from the **Artifacts** section at the bottom of this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
